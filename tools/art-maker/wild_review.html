<title>Wild Picture Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a review queue. Summary chips and filters on top, then one card per picture (new picture large, the
   home's first two pictures small beside it), approve / reject on each card; a full-size viewer with keys. */
:root {
  --bg: #eef1f6; --panel: #ffffff; --fg: #141a2a; --muted: #5b6478; --line: #d3d9e4; --chip: #e3e8f1;
  --accent: #96690a; --accent-fg: #ffffff;
  --ok: #2f7d4f; --ok-bg: #dcefe3; --no: #b23a3a; --no-bg: #f6dede;
  --shade: rgba(10, 14, 26, .86);
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1322; --panel: #151d31; --fg: #e5e9f3; --muted: #9aa4bb; --line: #2a3550; --chip: #1d2740;
  --accent: #e2b54e; --accent-fg: #1a1404;
  --ok: #7fd3a0; --ok-bg: #183626; --no: #f08a8a; --no-bg: #3a1a1d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1322; --panel: #151d31; --fg: #e5e9f3; --muted: #9aa4bb; --line: #2a3550; --chip: #1d2740;
  --accent: #e2b54e; --accent-fg: #1a1404;
  --ok: #7fd3a0; --ok-bg: #183626; --no: #f08a8a; --no-bg: #3a1a1d; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 26px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 75ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tab { font: 600 14px var(--body); border-radius: 999px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
select, .check { font: 500 14px var(--body); color: var(--fg); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.sync { font-size: 13px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; min-width: 0; }
.card.approved { border-color: var(--ok); }
.card.rejected { border-color: var(--no); }
.shot { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--chip); cursor: zoom-in; border: 0; padding: 0; display: block; width: 100%; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; cursor: default; }
.crop::before, .crop::after { content: ""; position: absolute; top: 0; bottom: 0; width: 5.35%; background: rgba(0, 0, 0, .45);
  border-color: rgba(255, 255, 255, .55); border-style: dashed; pointer-events: none; }
.crop::before { left: 0; border-width: 0 1px 0 0; }
.crop::after { right: 0; border-width: 0 0 0 1px; }
.body { padding: 12px 14px 14px; display: grid; gap: 10px; min-width: 0; }
.top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.idea { font-family: var(--display); font-weight: 700; font-size: 18px; }
.where { color: var(--muted); font-size: 13px; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--chip); color: var(--muted); }
.pill.approved { background: var(--ok-bg); color: var(--ok); }
.pill.rejected { background: var(--no-bg); color: var(--no); }
.prev { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prev span { font-size: 12px; color: var(--muted); }
.prev img { width: 120px; max-width: 30%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 14px var(--body); border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line);
  background: transparent; color: var(--fg); }
.btn.ok[aria-pressed="true"] { background: var(--ok); color: var(--panel); border-color: var(--ok); }
.btn.no[aria-pressed="true"] { background: var(--no); color: var(--panel); border-color: var(--no); }
.note { flex: 1 1 220px; min-width: 0; font: 400 14px var(--body); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.btn:focus-visible, .tab:focus-visible, .shot:focus-visible, .note:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.none { color: var(--muted); padding: 30px 0; text-align: center; }
.viewer { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: grid; grid-template-rows: 1fr auto;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); gap: 10px; }
.viewer .frame { position: relative; min-height: 0; display: grid; place-items: center; }
.viewer .frame > div { position: relative; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 120px) * 16 / 9)); }
.viewer img { width: 100%; height: 100%; object-fit: contain; display: block; }
.viewer .foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; color: #e5e9f3; }
.viewer .foot .btn { color: #e5e9f3; border-color: #4a5674; }
.viewer .keys { font-size: 13px; color: #9aa4bb; }
@media (prefers-reduced-motion: no-preference) { .btn, .tab, .card { transition: background .12s, border-color .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>Wild picture review</h1>
    <p class="lead">The third picture of every Landlordsector home. Approve or reject each one; a short note on a rejected picture tells Claude what to fix. The small pictures are the home's first two, for comparison.</p>
  </header>

  <div class="bar" role="group" aria-label="Show">
    <button class="tab" type="button" data-f="review" id="f-review">To review</button>
    <button class="tab" type="button" data-f="approved" id="f-approved">Approved</button>
    <button class="tab" type="button" data-f="rejected" id="f-rejected">Rejected</button>
    <button class="tab" type="button" data-f="all" id="f-all">All made</button>
    <select id="size" aria-label="Home size"><option value="">Every size</option></select>
    <label class="check"><input type="checkbox" id="crop"> Show the game's crop</label>
  </div>
  <div class="sync" id="sync" role="status">Loading your choices...</div>

  <div class="grid" id="grid"></div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="frame"><div id="vframe"><img id="vimg" alt=""></div></div>
  <div class="foot">
    <strong id="vtitle"></strong>
    <button class="btn ok" type="button" id="vok">Approve (A)</button>
    <button class="btn no" type="button" id="vno">Reject (R)</button>
    <button class="btn" type="button" id="vclose">Close (Esc)</button>
    <span class="keys">Left and right arrows: previous and next</span>
  </div>
</div>

<script>
const MANIFEST = __MANIFEST__;
const SIZES = MANIFEST.sizes, ITEMS = MANIFEST.items;
let verdicts = {};               // stem -> {status, note}
let filter = 'review', size = '', cropOn = false, viewing = -1;
let col = null, writing = {};
try { const s = JSON.parse(localStorage.getItem('lls-wild-review') || '{}'); filter = s.filter || filter; size = s.size || ''; cropOn = !!s.crop; } catch (e) {}
function savePrefs() { try { localStorage.setItem('lls-wild-review', JSON.stringify({filter, size, crop: cropOn})); } catch (e) {} }
try { verdicts = JSON.parse(localStorage.getItem('lls-wild-verdicts') || '{}') || {}; } catch (e) { verdicts = {}; }
function saveLocal() { try { localStorage.setItem('lls-wild-verdicts', JSON.stringify(verdicts)); } catch (e) {} }

const sel = document.getElementById('size');
SIZES.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
sel.value = size;
document.getElementById('crop').checked = cropOn;

function statusOf(it) { return (verdicts[it.stem] || {}).status || 'review'; }
function visible() {
  return ITEMS.filter(it => it.made && (!size || it.size === size) && (filter === 'all' || statusOf(it) === filter));
}
function counts() {
  const made = ITEMS.filter(it => it.made);
  const c = {review: 0, approved: 0, rejected: 0, all: made.length};
  made.forEach(it => c[statusOf(it)]++);
  document.getElementById('f-review').textContent = 'To review ' + c.review;
  document.getElementById('f-approved').textContent = 'Approved ' + c.approved;
  document.getElementById('f-rejected').textContent = 'Rejected ' + c.rejected;
  document.getElementById('f-all').textContent = 'All made ' + c.all + ' of ' + ITEMS.length;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', String(t.dataset.f === filter)));
}
const label = { review: 'To review', approved: 'Approved', rejected: 'Rejected' };
function card(it) {
  const st = statusOf(it), v = verdicts[it.stem] || {};
  const el = document.createElement('article');
  el.className = 'card ' + st;
  el.dataset.stem = it.stem;
  const shot = document.createElement('button');
  shot.type = 'button'; shot.className = 'shot' + (cropOn ? ' crop' : '');
  shot.setAttribute('aria-label', 'Open ' + it.idea + ' full size');
  const img = document.createElement('img'); img.loading = 'lazy'; img.alt = it.idea; img.src = 'pics/' + it.stem + '.jpg?v=' + it.v;
  shot.appendChild(img);
  shot.addEventListener('click', () => openViewer(it.stem));
  const body = document.createElement('div'); body.className = 'body';
  const top = document.createElement('div'); top.className = 'top';
  const t1 = document.createElement('div');
  const idea = document.createElement('div'); idea.className = 'idea'; idea.textContent = it.idea;
  const where = document.createElement('div'); where.className = 'where'; where.textContent = it.sizeName + ' on a ' + it.planetName + ' world  ·  ' + it.stem + '.jpg';
  t1.append(idea, where);
  const pill = document.createElement('span'); pill.className = 'pill ' + st; pill.textContent = label[st];
  top.append(t1, pill);
  const prev = document.createElement('div'); prev.className = 'prev';
  const ps = document.createElement('span'); ps.textContent = 'First two:';
  prev.appendChild(ps);
  it.prev.forEach(p => { const i = document.createElement('img'); i.loading = 'lazy'; i.alt = ''; i.src = 'thumbs/' + p + '.jpg'; prev.appendChild(i); });
  const acts = document.createElement('div'); acts.className = 'acts';
  const ok = document.createElement('button'); ok.type = 'button'; ok.className = 'btn ok'; ok.textContent = 'Approve';
  ok.setAttribute('aria-pressed', String(st === 'approved'));
  const no = document.createElement('button'); no.type = 'button'; no.className = 'btn no'; no.textContent = 'Reject';
  no.setAttribute('aria-pressed', String(st === 'rejected'));
  const note = document.createElement('input'); note.type = 'text'; note.className = 'note'; note.id = 'note-' + it.stem;
  note.placeholder = 'Note for Claude (what to change)'; note.value = v.note || '';
  ok.addEventListener('click', () => decide(it.stem, st === 'approved' ? 'review' : 'approved', note.value));
  no.addEventListener('click', () => { decide(it.stem, st === 'rejected' ? 'review' : 'rejected', note.value); });
  note.addEventListener('change', () => decide(it.stem, statusOf(it) === 'review' && note.value.trim() ? 'rejected' : statusOf(it), note.value));
  acts.append(ok, no, note);
  body.append(top, prev, acts);
  el.append(shot, body);
  return el;
}
function render() {
  counts();
  const grid = document.getElementById('grid');
  const list = visible();
  grid.replaceChildren(...list.map(card));
  if (!list.length) {
    const p = document.createElement('p'); p.className = 'none';
    p.textContent = filter === 'review' ? 'Nothing left to review here.' : 'No pictures in this list yet.';
    grid.replaceChildren(p);
  }
}
async function decide(stem, status, note) {
  const body = {status, note: (note || '').trim().slice(0, 600), at: new Date().toISOString()};
  const old = verdicts[stem] || {status: 'review', note: ''};
  if (old.status === body.status && (old.note || '') === body.note) return;
  verdicts[stem] = body; saveLocal(); render(); if (viewing >= 0) showViewer();
  if (!col) return;
  // one write at a time per picture: chain them
  writing[stem] = (writing[stem] || Promise.resolve()).then(() => col.doc(stem).set(body)).catch(() => {
    setSync('Could not save the last choice to the shared list; it is kept in this browser. Try again in a moment.');
  });
}
function setSync(t) { document.getElementById('sync').textContent = t; }

// The full-size viewer walks through the pictures of the current list.
let order = [];
function openViewer(stem) { order = visible().map(it => it.stem); viewing = Math.max(0, order.indexOf(stem)); showViewer(); document.getElementById('viewer').hidden = false; }
function showViewer() {
  if (!order.length) return closeViewer();
  viewing = Math.min(viewing, order.length - 1);
  const it = ITEMS.find(x => x.stem === order[viewing]);
  document.getElementById('vimg').src = 'pics/' + it.stem + '.jpg?v=' + it.v;
  document.getElementById('vimg').alt = it.idea;
  document.getElementById('vframe').className = cropOn ? 'crop' : '';
  const st = statusOf(it);
  document.getElementById('vtitle').textContent = (viewing + 1) + ' / ' + order.length + '  ' + it.idea + ' (' + it.sizeName + ', ' + it.planetName + ')';
  document.getElementById('vok').setAttribute('aria-pressed', String(st === 'approved'));
  document.getElementById('vno').setAttribute('aria-pressed', String(st === 'rejected'));
}
function closeViewer() { viewing = -1; document.getElementById('viewer').hidden = true; }
function step(d) { if (!order.length) return; viewing = (viewing + d + order.length) % order.length; showViewer(); }
function viewDecide(status) {
  const stem = order[viewing]; if (!stem) return;
  const cur = statusOf(ITEMS.find(x => x.stem === stem));
  decide(stem, cur === status ? 'review' : status, (verdicts[stem] || {}).note || '');
  if (cur !== status) step(1);
}
document.getElementById('vok').addEventListener('click', () => viewDecide('approved'));
document.getElementById('vno').addEventListener('click', () => viewDecide('rejected'));
document.getElementById('vclose').addEventListener('click', closeViewer);
document.addEventListener('keydown', e => {
  if (viewing < 0) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'a' || e.key === 'A') viewDecide('approved');
  else if (e.key === 'r' || e.key === 'R') viewDecide('rejected');
});

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { filter = t.dataset.f; savePrefs(); render(); }));
sel.addEventListener('change', () => { size = sel.value; savePrefs(); render(); });
document.getElementById('crop').addEventListener('change', e => { cropOn = e.target.checked; savePrefs(); render(); });
render();

(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use('db').catch(() => null) : null;
  if (!db) { setSync('Your choices are kept in this browser only here. Open the page signed in to claude.ai so Claude can read them.'); return; }
  col = db.collection('verdicts');
  const timer = setTimeout(() => setSync('The shared list cannot be reached yet; showing the choices saved in this browser.'), 10000);
  let first = true;
  col.onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    const shared = {};
    snap.docs.forEach(d => { const b = d.data() || {}; if (b.status) shared[d.id] = {status: b.status, note: b.note || ''}; });
    if (first && !snap.metadata.fromCache) {
      first = false;
      // Bring choices made in this browser while offline into the shared list once.
      Object.keys(verdicts).forEach(k => { if (!shared[k] && verdicts[k].status !== 'review') col.doc(k).set(verdicts[k]).catch(() => {}); });
      verdicts = Object.assign({}, verdicts, shared);
    } else if (!first) {
      verdicts = Object.assign({}, verdicts, shared);
    }
    saveLocal();
    setSync('Choices are saved for Claude as you click.');
    render(); if (viewing >= 0) showViewer();
  }, () => setSync('The shared list stopped updating; your choices are kept in this browser.'));
})();
</script>
