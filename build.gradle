plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java.srcDirs = ['src']
    }
    // Headless checks of the price and rent rules. Never shipped.
    check {
        java.srcDirs = ['check']
    }
}

repositories {
    mavenCentral()
}

// Starsector core (obfuscated game classes + bundled libs: lwjgl, json, log4j, ...)
def gameJars = fileTree(dir: "${starsectorPath}/starsector-core", include: '*.jar')
// OddiszCommons gives the Manage page and the ledger. Build ../OddiszCommons first.
def commonsJar = files('../OddiszCommons/jars/OddiszCommons.jar')

dependencies {
    compileOnly gameJars
    compileOnly commonsJar
    // LunaLib supplies the settings page. Found wherever the mod happens to be installed.
    compileOnly fileTree(dir: "${starsectorPath}/mods", include: '**/LunaLib.jar')
    checkImplementation gameJars
    checkImplementation files(sourceSets.main.output)
    checkImplementation commonsJar
}

jar {
    destinationDirectory = file('jars')
    archiveFileName = 'Landlordsector.jar'
}

// Starsector's classloader refuses java.io, java.nio.file and java.lang.reflect to mod code, and the
// refusal happens at class-resolution time - so a stray import surfaces as a crash somewhere else
// entirely. Catch it at build time instead by scanning every compiled class's constant pool.
tasks.register('checkNoForbiddenApis') {
    dependsOn tasks.named('classes')
    outputs.upToDateWhen { false }
    doLast {
        def forbidden = ['java/io/', 'java/nio/file/', 'java/lang/reflect/']
        def offenders = []
        sourceSets.main.output.classesDirs.each { dir ->
            fileTree(dir: dir, include: '**/*.class').each { f ->
                def text = new String(f.bytes, 'ISO-8859-1')
                forbidden.each { needle ->
                    if (text.contains(needle)) offenders << "${f.name} references ${needle}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Forbidden API used (Starsector will refuse to load it):\n  " +
                    offenders.join('\n  '))
        }
    }
}

tasks.named('jar') { dependsOn tasks.named('checkNoForbiddenApis') }

/** The price, rent and tier rules, checked without the game. */
tasks.register('checkRules', JavaExec) {
    dependsOn tasks.named('checkClasses')
    classpath = sourceSets.check.runtimeClasspath
    mainClass = 'landlordsector.RulesCheck'
    args file('data/config/landlordsector/tiers.json').absolutePath
}

/** The money loop on stand-in markets, on the game's own Java and classes. */
tasks.register('checkRuntime', JavaExec) {
    dependsOn tasks.named('checkClasses')
    classpath = sourceSets.check.runtimeClasspath
    mainClass = 'landlordsector.RuntimeCheck'
    args file('data/config/landlordsector/tiers.json').absolutePath
    executable = "${starsectorPath}/jre/bin/java.exe"
    jvmArgs '-XX:+UnlockDiagnosticVMOptions', '-XX:-BytecodeVerificationRemote', '-XX:-BytecodeVerificationLocal',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED', '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED', '--add-opens', 'java.base/java.text=ALL-UNNAMED', '--add-opens', 'java.desktop/java.awt.font=ALL-UNNAMED'
}

/** mod_info.json, the .version file and the Version Checker registration must agree. */
tasks.register('checkVersionMetadata') {
    doLast {
        def infoFile = file('mod_info.json')
        def versionFile = file('landlordsector.version')
        def registrationFile = file('data/config/version/version_files.csv')
        [infoFile, versionFile, registrationFile].each { metadata ->
            if (!metadata.isFile()) throw new GradleException("Missing update metadata: ${metadata.name}")
        }
        def parser = new groovy.json.JsonSlurper()
        def info = parser.parse(infoFile, 'UTF-8')
        def remote = parser.parse(versionFile, 'UTF-8')
        def parts = ['major', 'minor', 'patch'].collect { remote.modVersion?.get(it)?.toString() }
        if (parts.any { it == null || !(it ==~ /\d+/) } || info.version != parts.join('.'))
            throw new GradleException('mod_info.json and landlordsector.version must have the same numeric version')
        def masterUrl = 'https://raw.githubusercontent.com/andrzejsokolowski/starsector-landlordsector/main/landlordsector.version'
        def downloadUrl = 'https://github.com/andrzejsokolowski/starsector-landlordsector/releases/latest/download/Landlordsector.zip'
        def changelogUrl = 'https://raw.githubusercontent.com/andrzejsokolowski/starsector-landlordsector/main/changelog.txt'
        if (info.id != 'landlordsector' || info.name != remote.modName)
            throw new GradleException('Update metadata must identify Landlordsector')
        if (info.updateCheckURL != masterUrl || remote.masterVersionFile != masterUrl)
            throw new GradleException('Both update URLs must point to the published landlordsector.version file')
        if (remote.directDownloadURL != downloadUrl)
            throw new GradleException('The update download must point to the Landlordsector.zip release asset')
        if (remote.changelogURL != changelogUrl)
            throw new GradleException('changelogURL must point to changelog.txt on main')
        if (info.modThreadId?.toString() != remote.modThreadId?.toString())
            throw new GradleException('mod_info.json and the .version file must name the same forum topic')
        if (info.gameVersion != remote.starsectorVersion)
            throw new GradleException('The supported Starsector versions do not match')
        if (registrationFile.readLines('UTF-8').findAll { !it.trim().isEmpty() } != ['version file', 'landlordsector.version'])
            throw new GradleException('Version Checker must register landlordsector.version')
        // A library dependency named with a version must match exactly or the game disables the mod.
        def commons = info.dependencies.find { it.id == 'oddisz_commons' }
        if (commons == null || commons.version != null)
            throw new GradleException('Depend on oddisz_commons by id and name only, with no version')
        if (!file('changelog.txt').getText('UTF-8').startsWith("Version ${info.version} ("))
            throw new GradleException("changelog.txt must start with Version ${info.version}")
        logger.lifecycle("Update metadata verified for Landlordsector ${info.version}")
    }
}

/**
 * Checks the files that ship: no UTF-8 BOM (it breaks every Starsector JSON and CSV), every art path
 * exists, LunaLib text has no %, every sprite key exists and every rule command is a class.
 */
tasks.register('checkReleaseFiles') {
    dependsOn tasks.named('classes')
    doLast {
        def problems = []
        fileTree(projectDir) {
            include 'mod_info.json', '*.version', 'data/**/*.json', 'data/**/*.csv'
        }.each { f ->
            def bytes = f.bytes
            if (bytes.length >= 3 && (bytes[0] & 0xFF) == 0xEF && (bytes[1] & 0xFF) == 0xBB && (bytes[2] & 0xFF) == 0xBF)
                problems << "UTF-8 BOM in ${projectDir.toPath().relativize(f.toPath())}"
        }

        def core = file("${starsectorPath}/starsector-core")
        def artRef = ~/graphics\/[A-Za-z0-9_\-\/. ]+?\.(png|jpg|webp)/
        fileTree(projectDir) { include 'data/**', 'src/**/*.java' }.each { f ->
            (f.getText('UTF-8') =~ artRef).each { match ->
                def path = match[0]
                if (!file(path).isFile() && !new File(core, path).isFile())
                    problems << "${projectDir.toPath().relativize(f.toPath())} names missing art ${path}"
            }
        }

        // getSpriteName("category", "key") throws when the key is missing. Check every pair against the
        // game's settings.json with its comments stripped.
        def settingsText = new File(core, 'data/config/settings.json').getText('UTF-8').readLines()
                .collect { it.replaceFirst(/#.*$/, '') }.join('\n')
        def spriteKeys = { String category ->
            def start = settingsText.indexOf("\"${category}\"")
            def keys = [] as Set
            while (start >= 0) {
                def open = settingsText.indexOf('{', start)
                def colon = settingsText.indexOf(':', start)
                if (open > 0 && colon > 0 && settingsText.substring(colon + 1, open).trim().isEmpty()) {
                    int depth = 0
                    int i = open
                    for (; i < settingsText.length(); i++) {
                        def c = settingsText.charAt(i)
                        if (c == '{' as char) depth++
                        if (c == '}' as char && --depth == 0) break
                    }
                    (settingsText.substring(open, i) =~ /"([^"]+)"\s*:/).each { m -> keys << m[1] }
                }
                start = settingsText.indexOf("\"${category}\"", start + 1)
            }
            keys
        }
        fileTree(projectDir) { include 'src/**/*.java' }.each { f ->
            (f.getText('UTF-8') =~ /getSpriteName\("([^"]+)",\s*"([^"]+)"\)/).each { m ->
                if (!spriteKeys(m[1]).contains(m[2]))
                    problems << "${f.name} asks for sprite ${m[1]}/${m[2]}, which the game's settings.json does not have"
            }
        }

        // Sound ids must exist in the game's sounds.json.
        def sounds = new File(core, 'data/config/sounds.json').getText('UTF-8')
        fileTree(projectDir) { include 'src/**/*.java' }.each { f ->
            (f.getText('UTF-8') =~ /(?:playUISound|setSound)\("([^"]+)"/).each { m ->
                if (!sounds.contains("\"${m[1]}\"")) problems << "${f.name} plays sound ${m[1]}, which the game does not have"
            }
        }

        // LunaLib runs setting names and descriptions through String.format: a bare % crashes the
        // game the moment that settings tab opens. Write "percent" instead.
        file('data/config/LunaSettings.csv').readLines('UTF-8').eachWithIndex { line, i ->
            if (line.contains('%')) problems << "LunaSettings.csv line ${i + 1} contains % (crashes LunaLib): write \"percent\""
        }
        def luna = new groovy.json.JsonSlurper().parse(file('data/config/LunaSettingsConfig.json'))
        if (!luna.containsKey('landlordsector')) problems << 'LunaLib icon is not keyed by the mod id'
        luna.each { modId, config -> if (!file(config.iconPath).isFile()) problems << "LunaLib icon missing: ${config.iconPath}" }

        // Every rule command named in rules.csv must be a compiled class in the rulecmd package.
        def classes = sourceSets.main.output.classesDirs.singleFile
        (file('data/campaign/rules.csv').getText('UTF-8') =~ /\b(LLS_[A-Za-z]+)\b/).each { m ->
            def cls = new File(classes, "com/fs/starfarer/api/impl/campaign/rulecmd/${m[1]}.class")
            if (!cls.isFile()) problems << "rules.csv names ${m[1]}, which is not a rule command class"
        }

        if (problems) throw new GradleException("Release files are not ready:\n  " + problems.join('\n  '))
        logger.lifecycle('Release files verified')
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkNoForbiddenApis'), tasks.named('checkRules'), tasks.named('checkRuntime'),
            tasks.named('checkVersionMetadata'), tasks.named('checkReleaseFiles')
}

// Only what the game loads.
def releaseFiles = copySpec {
    from(projectDir) {
        include 'mod_info.json', 'landlordsector.version', 'icon.png'
        include 'data/**', 'graphics/**', 'jars/Landlordsector.jar'
    }
}

// Sync, not Copy: files that no longer ship must not linger in the staging folder.
tasks.register('stageRelease', Sync) {
    dependsOn tasks.named('jar')
    with releaseFiles
    into layout.projectDirectory.dir('Landlordsector')
}

// Package directly from the source files so stale staging contents cannot enter a release.
tasks.register('releaseZip', Zip) {
    dependsOn tasks.named('stageRelease'), tasks.named('check')
    destinationDirectory = layout.projectDirectory
    archiveFileName = 'Landlordsector.zip'
    into('Landlordsector') { with releaseFiles }
}
